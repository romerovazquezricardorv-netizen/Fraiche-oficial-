<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f0e9">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fraiche">

  <title>Fraiche · Ventas</title>

  <style>
        :root {
      --bg: #f7f2ec;
      --card: #fffaf6;
      --text: #352d2a;
      --muted: #8e7e76;
      --line: #dfd2c8;
      --accent: #a85f45;
      --accent-soft: #ead8cd;
      --gold: #b89a61;
      --shadow: 0 8px 24px rgba(72, 50, 40, .08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(30px, env(safe-area-inset-bottom));
    }

    button {
      font: inherit;
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin: 8px 0 20px;
    }

    .brand-small {
      margin: 0 0 5px;
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .date-nav {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .date-nav button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      font-size: 22px;
    }

    .date {
      text-align: center;
    }

    .date strong {
      display: block;
      font-size: 16px;
      font-weight: 500;
    }

    .date span {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      }
        .goal-card {
      background: var(--card);
      border: 1px solid rgba(168, 95, 69, .12);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 18px;
    }

    .trophy-wrap {
      width: 118px;
      height: 118px;
      margin: 2px auto 10px;
      position: relative;
    }

    .trophy {
      width: 100%;
      height: 100%;
      display: block;
    }

    .trophy-outline {
      fill: none;
      stroke: var(--gold);
      stroke-width: 4;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .goal-money {
      margin: 4px 0 2px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 46px;
      font-weight: 400;
      color: var(--accent);
    }

    .goal-sub {
      margin: 0;
      font-size: 15px;
      color: var(--muted);
    }

    .goal-sub strong {
      color: var(--text);
    }

    .remaining {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .smart-tip {
      margin-top: 14px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    .smart-tip strong {
      color: var(--accent);
    }

    .section {
      margin-top: 24px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .section-title::after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      }
        .product-btn {
      position: relative;
      min-width: 0;
      min-height: 96px;
      padding: 14px 5px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 5px 16px rgba(72, 50, 40, .05);
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .product-btn:active {
      transform: scale(.97);
    }

    .product-btn .plus {
      position: absolute;
      top: 8px;
      right: 9px;
      color: var(--accent);
      font-size: 17px;
    }

    .product-btn .size {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(19px, 6vw, 25px);
      line-height: 1;
      white-space: nowrap;
    }

    .product-btn .profit {
      display: block;
      margin-top: 9px;
      color: var(--accent);
      font-size: 13px;
      white-space: nowrap;
    }

    .counter-card,
    .summary-card,
    .history-card,
    .close-card {
      margin-top: 14px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .counter-title {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .counter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .counter-item {
      padding: 10px 3px;
      border-radius: 14px;
      background: rgba(234, 216, 205, .35);
      text-align: center;
    }

    .counter-item strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 400;
    }

    .counter-item span {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      color: var(--muted);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .stat {
      padding: 13px;
      border-radius: 15px;
      background: rgba(234, 216, 205, .28);
    }

    .stat span {
      display: block;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat strong {
      display: block;
      margin-top: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 400;
        }
        .sales-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .sale-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.45);
    }

    .sale-name {
      font-size: 13px;
    }

    .sale-profit {
      color: var(--accent);
      font-weight: 600;
    }

    .delete-sale {
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
    }

    .empty {
      padding: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .history-btn,
    .close-day-btn {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 14px 16px;
      background: var(--card);
      text-align: left;
    }

    .history-btn strong,
    .close-day-btn strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 400;
    }

    .history-btn span,
    .close-day-btn span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .close-day-btn {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
      text-align: center;
    }

    .close-day-btn span {
      color: rgba(255,255,255,.8);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 390px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <main></main>
</body>
</html>
